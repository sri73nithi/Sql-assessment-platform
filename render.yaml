services:
  - type: web
    name: sql-assessment-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./platform.db
      - key: SANDBOX_DATABASE_URL
        value: sqlite:///./sandbox.db
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
